apiVersion: v1
kind: Pod
metadata:
  name: servidor-teste
  namespace: tcc2-infra-test
  labels:
    app: servidor-teste
spec:
  nodeName: tcc2-pon-worker
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
