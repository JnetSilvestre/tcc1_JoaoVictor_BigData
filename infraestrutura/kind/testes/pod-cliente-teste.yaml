apiVersion: v1
kind: Pod
metadata:
  name: cliente-teste
  namespace: tcc2-infra-test
  labels:
    app: cliente-teste
spec:
  nodeName: tcc2-pon-control-plane
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
