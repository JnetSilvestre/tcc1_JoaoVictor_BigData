# TCC2 / Etapa 09 / C3 — manifestos propostos; validacao real ainda pendente.
# Imagem aprovada em C2 (E08-D08): tcc2-pon:c2-e08-dbefcd2cf3d2
# Image ID no Docker do academico: sha256:b9c714f32e359e7a21df264a926a840191c3ffb6d53bb0483f5e161143d8667a
# imagePullPolicy: Never exige carregar ESTA imagem nos nos kind antes do apply.
# Os Services usam o /health/live como readiness de TRANSPORTE, pois
# /health/ready da aplicacao retorna 503 antes do snapshot e causaria
# bloqueio da inicializacao em cadeia. Conferir /health/ready APOS snapshot.
# Nao ha garantia de persistencia, escalonamento horizontal ou multinó fisico.
apiVersion: v1
kind: Namespace
metadata:
  name: tcc2-pon
  labels:
    app.kubernetes.io/part-of: tcc2-pon-c3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcc2-pon-c3-config
  namespace: tcc2-pon
data:
  ATTRIBUTE_DOWNSTREAM_HOST: logic-engine
  LOGIC_DOWNSTREAM_HOST: rule-executor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-executor
  namespace: tcc2-pon
  labels:
    app.kubernetes.io/name: rule-executor
    app.kubernetes.io/part-of: tcc2-pon-c3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rule-executor
  template:
    metadata:
      labels:
        app: rule-executor
        app.kubernetes.io/part-of: tcc2-pon-c3
    spec:
      containers:
        - name: rule-executor
          image: tcc2-pon:c2-e08-dbefcd2cf3d2
          imagePullPolicy: Never
          args: ["rule-executor", "--port", "8080", "--listen-host", "0.0.0.0"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rule-executor
  namespace: tcc2-pon
spec:
  type: ClusterIP
  selector:
    app: rule-executor
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logic-engine
  namespace: tcc2-pon
  labels:
    app.kubernetes.io/name: logic-engine
    app.kubernetes.io/part-of: tcc2-pon-c3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logic-engine
  template:
    metadata:
      labels:
        app: logic-engine
        app.kubernetes.io/part-of: tcc2-pon-c3
    spec:
      containers:
        - name: logic-engine
          image: tcc2-pon:c2-e08-dbefcd2cf3d2
          imagePullPolicy: Never
          args:
            - logic-engine
            - --port
            - "8080"
            - --listen-host
            - 0.0.0.0
            - --downstream-host
            - $(DOWNSTREAM_HOST)
            - --downstream-port
            - "8080"
          env:
            - name: DOWNSTREAM_HOST
              valueFrom:
                configMapKeyRef:
                  name: tcc2-pon-c3-config
                  key: LOGIC_DOWNSTREAM_HOST
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: logic-engine
  namespace: tcc2-pon
spec:
  type: ClusterIP
  selector:
    app: logic-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attribute-source
  namespace: tcc2-pon
  labels:
    app.kubernetes.io/name: attribute-source
    app.kubernetes.io/part-of: tcc2-pon-c3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attribute-source
  template:
    metadata:
      labels:
        app: attribute-source
        app.kubernetes.io/part-of: tcc2-pon-c3
    spec:
      containers:
        - name: attribute-source
          image: tcc2-pon:c2-e08-dbefcd2cf3d2
          imagePullPolicy: Never
          args:
            - attribute-source
            - --port
            - "8080"
            - --listen-host
            - 0.0.0.0
            - --downstream-host
            - $(DOWNSTREAM_HOST)
            - --downstream-port
            - "8080"
          env:
            - name: DOWNSTREAM_HOST
              valueFrom:
                configMapKeyRef:
                  name: tcc2-pon-c3-config
                  key: ATTRIBUTE_DOWNSTREAM_HOST
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attribute-source
  namespace: tcc2-pon
spec:
  type: ClusterIP
  selector:
    app: attribute-source
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
